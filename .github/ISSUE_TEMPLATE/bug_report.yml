name: Bug Report
description: Something is broken or behaving unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        Fill in as much detail as you can -- the more context, the faster it gets fixed.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I click Export PNG, the bottom of the biodata card is cropped in the downloaded image."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should have happened instead?
      placeholder: "The full A4 layout should be captured without any cropping."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console errors
      description: Open DevTools (F12 > Console) and paste any errors shown.
      render: text

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: "Chrome 126 / Firefox 127 / Safari 17"

  - type: input
    id: node_version
    attributes:
      label: Node.js version (if running locally)
      placeholder: "22.3.0"

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / macOS 14 / Ubuntu 24.04"
